version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartlearn-web
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      # 开发模式：挂载本地文件，修改后自动生效
      - ./index.html:/usr/share/nginx/html/index.html
      - ./courses.html:/usr/share/nginx/html/courses.html
      - ./plan.html:/usr/share/nginx/html/plan.html
      - ./resources.html:/usr/share/nginx/html/resources.html
      - ./profile.html:/usr/share/nginx/html/profile.html
      - ./about.html:/usr/share/nginx/html/about.html
      - ./contact.html:/usr/share/nginx/html/contact.html
      - ./demo.html:/usr/share/nginx/html/demo.html
      - ./licenses.html:/usr/share/nginx/html/licenses.html
      - ./css:/usr/share/nginx/html/css
      - ./js:/usr/share/nginx/html/js
    networks:
      - smartlearn-network
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - licensing-api

  # 素材授权台 API（Python 标准库，无需构建镜像）
  licensing-api:
    image: python:3.11-slim
    container_name: smartlearn-licensing-api
    working_dir: /app
    volumes:
      - ./server:/app
      - licensing-data:/data
    command: python licensing_server.py --port 8081 --db /data/licensing.db
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smartlearn-network
    environment:
      - TZ=Asia/Shanghai

volumes:
  licensing-data:

networks:
  smartlearn-network:
    driver: bridge
